<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>5pla Scene Editor</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        margin: 0;
        height: 100%;
      }

      body {
        background: #121218;
        color: #eceae6;
        font-family: ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
      }

      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
